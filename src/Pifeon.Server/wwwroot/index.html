<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>Pifeon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pifeon: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl items-center justify-center p-4 sm:p-6">
    <section class="w-full rounded-3xl border border-white/10 bg-white/5 p-6 shadow-2xl shadow-black/30 backdrop-blur">
      <div class="mb-6 space-y-2 text-center">
        <p class="text-sm font-semibold uppercase tracking-[0.35em] text-pifeon-300">Pifeon</p>
        <h1 class="text-3xl font-bold sm:text-4xl">Send one file</h1>
        <p class="text-sm text-slate-300">Choose a file, share the session code, and wait for the receiver to connect.</p>
      </div>

      <div class="space-y-4">
        <div class="flex flex-col gap-3 sm:flex-row">
          <input id="fileInput" type="file" class="hidden" />
          <button id="chooseFileButton" type="button" class="inline-flex flex-1 items-center justify-center rounded-2xl bg-pifeon-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-pifeon-400 focus:outline-none focus:ring-2 focus:ring-pifeon-300 focus:ring-offset-2 focus:ring-offset-slate-950">
            Choose file
          </button>
          <button id="cancelButton" type="button" class="hidden inline-flex items-center justify-center rounded-2xl border border-white/15 bg-white/5 px-5 py-3 text-sm font-semibold text-slate-100 transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-pifeon-300 focus:ring-offset-2 focus:ring-offset-slate-950">
            Cancel
          </button>
        </div>

        <div id="fileCard" class="hidden rounded-2xl border border-white/10 bg-slate-900/70 p-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <p class="text-xs uppercase tracking-[0.24em] text-slate-400">Selected file</p>
              <p id="fileName" class="mt-1 font-medium text-white"></p>
              <p id="fileSize" class="text-sm text-slate-400"></p>
            </div>
            <div class="rounded-full border border-pifeon-400/30 bg-pifeon-400/10 px-3 py-1 text-xs font-semibold text-pifeon-200">
              Sender
            </div>
          </div>
        </div>

        <div id="sessionCard" class="hidden rounded-2xl border border-white/10 bg-slate-900/70 p-4">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <p class="text-xs uppercase tracking-[0.24em] text-slate-400">Session code</p>
              <p id="sessionCode" class="mt-2 text-4xl font-black tracking-[0.18em] text-pifeon-200"></p>
              <p class="mt-2 text-sm text-slate-400">Share this code with the receiver.</p>
            </div>
            <div class="rounded-full border border-amber-400/30 bg-amber-400/10 px-3 py-1 text-xs font-semibold text-amber-200">
              Waiting for receiver
            </div>
          </div>
        </div>

        <div id="progressCard" class="hidden rounded-2xl border border-white/10 bg-slate-900/70 p-4">
          <div class="mb-3 flex items-center justify-between gap-3">
            <p id="progressLabel" class="text-sm font-medium text-slate-200"></p>
            <p id="progressValue" class="text-sm text-slate-400"></p>
          </div>
          <div class="h-3 overflow-hidden rounded-full bg-white/10">
            <div id="progressBar" class="h-full w-0 rounded-full bg-gradient-to-r from-pifeon-400 to-cyan-300 transition-all"></div>
          </div>
        </div>

        <div id="statusCard" class="hidden rounded-2xl border border-white/10 bg-slate-900/70 p-4">
          <p id="statusTitle" class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-400"></p>
          <p id="statusMessage" class="mt-2 text-sm text-slate-200"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
