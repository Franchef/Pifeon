name: Bug report
description: Report a reproducible problem with Pifeon
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues. Do not include credentials,
        private keys, personal data, or sensitive files.
  - type: input
    id: version
    attributes:
      label: Pifeon version or commit
      description: Include the release version or commit hash, if known.
      placeholder: "e.g. 1.0.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest steps that reproduce the problem.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Remove secrets and personal information before sharing logs.
    validations:
      required: true
