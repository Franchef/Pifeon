name: Build, Test & Code Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to update repository files / badges
      pull-requests: write # Allows posting PR coverage comments

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Create Coverage Directory
      run: mkdir -p ./coverage

    # Executes tests using Microsoft.Testing.Platform and generates Cobertura report
    - name: Run Tests with Code Coverage
      run: >
        dotnet test --no-build --configuration Release --verbosity normal
        --
        --coverage
        --coverage-output-format cobertura
        --coverage-output coverage.cobertura.xml

    # Gathers generated coverage files from build artifacts into the ./coverage directory
    - name: Collect Coverage Reports
      run: |
        find . -name "*.cobertura.xml" -exec cp {} ./coverage/ \;
        ls -R ./coverage

    # Generates coverage summary (it automatically generates a badge file if 'badge: true')
    - name: Code Coverage Summary & Threshold Check
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: 'coverage/*.cobertura.xml'
        badge: true
        fail_below_min: true
        thresholds: '80 60'
        format: markdown
        output: file

    # Organizes and commits coverage badge
    - name: Commit Coverage Badge
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        mkdir -p .github/badges
        if [ -f code-coverage-badge.svg ]; then
          mv code-coverage-badge.svg .github/badges/coverage.svg
        fi

    # Posts detailed coverage breakdown on open Pull Requests
    - name: Add PR Coverage Comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: code-coverage-results.md