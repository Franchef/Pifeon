name: Build, Test & Code Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # Allows posting PR coverage comments

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Restore Coverage Tool
      run: dotnet tool restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    # Executes tests using Microsoft.Testing.Platform and generates Cobertura report
    - name: Run Tests with Code Coverage
      run: |
        dotnet test --project tests/Pifeon.Tests/Pifeon.Tests.csproj --no-build --configuration Release --verbosity normal --results-directory "$GITHUB_WORKSPACE/coverage/unit" --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
        dotnet test --project tests/Pifeon.IntegrationTests/Pifeon.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --results-directory "$GITHUB_WORKSPACE/coverage/integration" --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

    # Merge hits for shared code instead of overwriting reports or double-counting lines.
    - name: Merge Coverage Reports
      run: |
        test -s coverage/unit/coverage.cobertura.xml
        test -s coverage/integration/coverage.cobertura.xml
        dotnet tool run dotnet-coverage merge coverage/unit/coverage.cobertura.xml coverage/integration/coverage.cobertura.xml --output coverage/merged.cobertura.xml --output-format cobertura

    - name: Code Coverage Summary & Threshold Check
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: 'coverage/merged.cobertura.xml'
        badge: true
        fail_below_min: true
        thresholds: '80 90'
        hide_branch_rate: true
        hide_complexity: true
        format: markdown
        output: both

    # Organizes the generated coverage badge in the workspace.
    - name: Place Coverage Badge
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        mkdir -p .github/badges
        if [ -f code-coverage-badge.svg ]; then
          mv code-coverage-badge.svg .github/badges/coverage.svg
        fi

    # Posts detailed coverage breakdown on open Pull Requests
    - name: Add PR Coverage Comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        path: code-coverage-results.md